<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72">
  <defs>
    <linearGradient id="meko-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2F97"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
  </defs>
  <!-- Stylized M Icon with modern dynamic polygons -->
  <g transform="translate(10, 8)">
    <!-- Left pillar of M -->
    <path d="M4 48 L4 12 L18 26 L18 48 Z" fill="#1E2F97"/>
    <!-- Center peak & right slope of M -->
    <path d="M18 26 L30 12 L42 26 L42 48 L32 48 L32 30 L24 38 Z" fill="#F57C00"/>
    <!-- Right pillar with arrow dynamic -->
    <path d="M42 26 L54 12 L54 48 L42 48 Z" fill="#6F8A4F"/>
