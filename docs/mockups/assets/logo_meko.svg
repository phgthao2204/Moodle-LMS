    <circle cx="30" cy="6" r="3.5" fill="#F57C00"/>
  </g>
  <!-- Brand Name Typography -->
  <text x="76" y="42" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="28" font-weight="900" fill="#0F172A" letter-spacing="-0.5">MEKOSOFT</text>
  <!-- LMS Pill Badge -->
