  <text x="273" y="38.5" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">LMS</text>
  <text x="78" y="56" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="1.2">DIGITAL LEARNING ECOSYSTEM</text>
</svg>
