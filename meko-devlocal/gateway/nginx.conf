server {
    listen 80;
    listen [::]:80;
    server_name meko.localhost localhost 127.0.0.1;

    client_max_body_size 256m;

    # Static Dev Team Info Dashboard (always reachable even while Liferay is booting)
    location = /dev-info {
        root /usr/share/nginx/html;
        try_files /dev-info.html =404;
    }

    location = /dev-info.html {
        root /usr/share/nginx/html;
    }

    # Redirect /lms -> /lms/
    location = /lms {
        return 301 /lms/;
    }

    # Moodle 5.3 LMS at /lms/ (^~ prevents regex locations from hijacking assets)
    location ^~ /lms/ {
        proxy_pass http://devlocal-moodle:80/lms/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Mailpit Email Test Web UI (/mail)
    location = /mail {
        return 301 /mail/;
    }
    location ^~ /mail/ {
        proxy_pass http://devlocal-mailpit:8025/mail/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }

    # Liferay TMS Sub-portal shortcut (/tms -> /web/tms)
    location = /tms {
        return 302 /web/tms;
    }

    location = /tms/ {
        return 302 /web/tms;
    }

    # Liferay 7.4 GA132 (CMS at / and TMS at /web/tms)
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $liferay_upstream http://devlocal-liferay:8080;
        proxy_pass $liferay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /dev-info.html;
    }
}
