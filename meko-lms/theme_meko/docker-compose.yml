# ==============================================================================
# MEKOSOFT LMS - CHUẨN DOCKER COMPOSE DÙNG CHUNG CHO TOÀN BỘ DEV TEAM
# Hệ thống: Moodle 5.3 LTS + PostgreSQL 17 Alpine + Theme MEKO (Live Mount)
# Port chuẩn thống nhất: http://localhost:8088
# ==============================================================================

services:
  db:
    image: postgres:17-alpine
    container_name: ${DB_CONTAINER:-meko-postgres-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-accees_lms}
      POSTGRES_USER: ${DB_USER:-lms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-LmsPassword2026!@#}
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - meko-network

  moodle:
    image: elestio/moodle:v5.3.0
    container_name: ${MOODLE_CONTAINER:-meko-lms-app}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8088}:80"
    environment:
      - MOODLE_DATABASE_HOST=${DB_CONTAINER:-meko-postgres-db}
      - MOODLE_DATABASE_PORT_NUMBER=5432
      - MOODLE_DATABASE_NAME=${DB_NAME:-accees_lms}
      - MOODLE_DATABASE_USER=${DB_USER:-lms_user}
      - MOODLE_DATABASE_PASSWORD=${DB_PASSWORD:-LmsPassword2026!@#}
      - MOODLE_DATABASE_TYPE=pgsql
      - MOODLE_HOST=http://${DOMAIN:-localhost}:${PORT:-8088}
      - MOODLE_SITE_NAME=MEKOSOFT LMS - Digital Learning & Competencies
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=AdminMoodle2026!@#
      - MOODLE_EMAIL=admin@mekosoft.vn
    volumes:
      - moodledata:/var/moodledata
      # Mount trực tiếp theme_meko từ thư mục hiện tại vào Moodle
      - .:/var/www/html/theme/meko
      - .:/var/www/html/public/theme/meko
      # Mount trực tiếp plugin Khung năng lực số (đóng gói sẵn trong repo)
      - ./local_dev/plugins/accees_competencies:/var/www/html/public/local/accees_competencies
      - ./local_dev/plugins/accees_competencies:/var/www/html/local/accees_competencies
    networks:
      - meko-network

volumes:
  pgdata17:
    name: meko_lms_pgdata17
  moodledata:
    name: meko_lms_moodledata

networks:
  meko-network:
    name: meko_lms_network
    driver: bridge

