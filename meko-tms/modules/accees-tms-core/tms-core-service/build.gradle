dependencies {
	api project(":modules:accees-tms-core:tms-core-api")

	compileOnly group: "com.liferay.portal", name: "release.portal.api"
}

buildService {
	apiDir = "../tms-core-api/src/main/java"
	testDir = "../tms-core-test/src/testIntegration/java"
